<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <h3>Danh sách lịch tư vấn từ Giảng viên</h3>

        <div th:if="${#lists.isEmpty(availableSessions)}" class="alert alert-warning">
            Hiện tại chưa có giảng viên nào tạo lịch tư vấn. Vui lòng quay lại sau.
        </div>

        <table th:if="${!#lists.isEmpty(availableSessions)}" class="table table-bordered">
            <thead>
            <tr>
                <th>Giảng viên</th>
                <th>Phòng Lab</th>
                <th>Thiết bị</th>
                <th>Thời gian</th>
                <th>Chủ đề</th>
                <th>Hành động</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s : ${availableSessions}">
                <td th:text="${s.lecturer.profile.fullName}"></td>
                <td th:text="${s.labRoom.roomName}"></td>
                <td th:text="${s.equipment != null ? s.equipment.name : 'Không có'}"></td>
                <td th:text="${#dates.format(s.startTime, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${s.topic}"></td>
                <td>
                    <form th:action="@{/mentoring/student/register}" method="post">
                        <input type="hidden" name="sessionId" th:value="${s.id}">
                        <button type="submit" class="btn btn-success btn-sm">Đăng ký tham gia</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
<!-- Optional JavaScript -->
<!-- jQuery first, then Popper.js, then Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
</body>
</html>
