<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Đặt lịch tư vấn</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4" style="max-width: 720px;">
    <h3>Đặt lịch cố vấn học tập</h3>

    <div th:if="${msgError}" class="alert alert-danger" th:text="${msgError}"></div>

    <form th:action="@{/mentoring/student/add}" method="get" class="mb-3">
        <div class="form-group">
            <label>Khoa / Ngành</label>
            <select name="departmentId" class="form-control" onchange="this.form.submit()" >
                <option value="">-- Chọn khoa/ngành --</option>
                <option th:each="d : ${departments}"
                        th:value="${d.id}"
                        th:text="${d.name}"
                        th:selected="${selectedDepartmentId != null && d.id.equals(selectedDepartmentId)}">
                </option>
            </select>
        </div>
    </form>

    <form th:action="@{/mentoring/student/book}" method="post" th:object="${bookingDTO}">
        <input type="hidden" th:field="*{departmentId}">

        <div class="form-group">
            <label>Giảng viên</label>
            <select th:field="*{lecturerId}" class="form-control" >
                <option value="">-- Chọn giảng viên --</option>
                <option th:each="l : ${lecturers}"
                        th:value="${l.id}"
                        th:text="${l.profile != null ? l.profile.fullName : l.username}">
                </option>
            </select>
            <small th:if="${selectedDepartmentId == null}" class="text-muted">
                Hãy chọn khoa/ngành trước để hiện danh sách giảng viên.
            </small>
        </div>

        <div class="form-group">
            <label>Ngày giờ tư vấn</label>
            <input type="datetime-local" th:field="*{startTime}" class="form-control" >
        </div>

        <div class="form-group">
            <label>Chủ đề cần tư vấn</label>
            <input type="text" th:field="*{topic}" class="form-control" >
        </div>

        <button type="submit" class="btn btn-success">Đặt lịch</button>
        <a th:href="@{/student/home}" class="btn btn-secondary">Quay lại</a>
    </form>
</div>
</body>
</html>
