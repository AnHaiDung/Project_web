<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="#">Smart Academic</a>
        <div class="navbar-text ml-auto">
            Xin chào, <b th:text="${session.userSession.profile.fullName}"></b> |
            <a href="/logout" class="text-danger">Đăng xuất</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Lịch hẹn cố vấn của tôi</h2>
            <a href="/student/mentoring/add" class="btn btn-primary">Đăng ký lịch mới</a>
        </div>

        <div class="table-responsive">
            <table class="table table-hover table-bordered bg-white shadow-sm">
                <thead class="thead-light">
                <tr>
                    <th>Ngày gửi</th>
                    <th>Chủ đề</th>
                    <th>Giảng viên</th>
                    <th>Địa điểm (Phòng Lab)</th>
                    <th>Trạng thái</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${mySessions}">
                    <td th:text="${#dates.format(s.startTime, 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${s.topic}"></td>
                    <td th:text="${s.lecturer.profile.fullName}"></td>
                    <td>
                        <span class="badge badge-info" th:text="${s.labRoom.roomName}"></span>
                    </td>
                    <td>
                        <span th:if="${s.status == 'PENDING'}" class="badge badge-warning">Chờ duyệt</span>
                        <span th:if="${s.status == 'APPROVED'}" class="badge badge-success">Đã chấp nhận</span>
                        <span th:if="${s.status == 'REJECTED'}" class="badge badge-danger">Từ chối</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(mySessions)}">
                    <td colspan="5" class="text-center">Bạn chưa có yêu cầu cố vấn nào.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
<!-- Optional JavaScript -->
<!-- jQuery first, then Popper.js, then Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
</body>
</html>
