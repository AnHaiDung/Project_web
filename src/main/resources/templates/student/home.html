<!doctype html>
<html lang="en">
<head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <a class="navbar-brand">Smart Academic - Sinh viên</a>
        <div class="ml-auto text-white">
            Xin chào, <b th:text="${session.userSession.profile.fullName}"></b> |
            <a th:href="@{/logout}" class="text-white">Đăng xuất</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between">
            <h2>Lịch hẹn của tôi</h2>
            <a th:href="@{/student/mentoring/add}" class="btn btn-success">Tạo yêu cầu mới</a>
        </div>
        <table class="table table-hover mt-3">
            <thead>
            <tr>
                <th>Ngày</th>
                <th>Giảng viên</th>
                <th>Phòng Lab</th>
                <th>Chủ đề</th>
                <th>Trạng thái</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s : ${mySessions}">
                <td th:text="${#dates.format(s.startTime, 'dd/MM/yyyy')}"></td>
                <td th:text="${s.lecturer.profile.fullName}"></td>
                <td th:text="${s.labRoom.roomName}"></td>
                <td th:text="${s.topic}"></td>
                <td>
                    <span th:if="${s.status == 'PENDING'}" class="badge badge-warning">Đang chờ</span>
                    <span th:if="${s.status == 'APPROVED'}" class="badge badge-success">Đã duyệt</span>
                    <span th:if="${s.status == 'REJECTED'}" class="badge badge-danger">Bị từ chối</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
<!-- Optional JavaScript -->
<!-- jQuery first, then Popper.js, then Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
</body>
</html>
