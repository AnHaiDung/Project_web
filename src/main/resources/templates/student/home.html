<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sinh viên - Trang chủ</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <a class="navbar-brand">Smart Academic - Sinh viên</a>
    <div class="ml-auto text-white">
        Xin chào,
        <b th:text="${session.userSession.profile != null ? session.userSession.profile.fullName : session.userSession.username}"></b>
        |
        <a th:href="@{/logout}" class="text-white">Đăng xuất</a>
    </div>
</nav>

<div class="container mt-4">
    <div th:if="${msgSuccess}" class="alert alert-success" th:text="${msgSuccess}"></div>
    <div th:if="${msgError}" class="alert alert-danger" th:text="${msgError}"></div>

    <div class="d-flex justify-content-between align-items-center">
        <h2>Lịch hẹn của tôi</h2>
        <a th:href="@{/mentoring/student/add}" class="btn btn-success">Tạo yêu cầu mới</a>
    </div>

    <table class="table table-hover mt-3">
        <thead>
        <tr>
            <th>Ngày</th>
            <th>Giảng viên</th>
            <th>Phòng Lab</th>
            <th>Chủ đề</th>
            <th>Trạng thái</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="s : ${mySessions}">
            <td th:text="${s.startTime != null ? #dates.format(s.startTime, 'dd/MM/yyyy HH:mm') : 'Chưa có thời gian'}"></td>

            <td th:text="${s.lecturer != null && s.lecturer.profile != null ? s.lecturer.profile.fullName : 'Không rõ'}"></td>

            <td th:text="${s.labRoom != null ? s.labRoom.roomName : 'Chưa có phòng'}"></td>

            <td th:text="${s.topic != null ? s.topic : 'Chưa có chủ đề'}"></td>

            <td>
                <span th:if="${s.status == 'PENDING'}" class="badge badge-warning">Đang chờ</span>
                <span th:if="${s.status == 'APPROVED'}" class="badge badge-success">Đã duyệt</span>
                <span th:if="${s.status == 'REJECTED'}" class="badge badge-danger">Bị từ chối</span>
                <span th:if="${s.status == 'AVAILABLE'}" class="badge badge-info">Còn trống</span>
                <span th:if="${s.status == null}" class="badge badge-secondary">Chưa có trạng thái</span>
            </td>
        </tr>

        <tr th:if="${mySessions == null || #lists.isEmpty(mySessions)}">
            <td colspan="5" class="text-center text-muted">
                Bạn chưa đăng ký lịch tư vấn nào.
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
