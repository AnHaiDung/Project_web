<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Đăng nhập</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5" style="max-width: 450px;">
    <div class="card shadow-sm">
        <div class="card-body">
            <h3 class="text-center mb-4 text-primary">Đăng Nhập</h3>

            <div th:if="${msgError}" class="alert alert-danger" th:text="${msgError}"></div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label>Tên đăng nhập</label>
                    <input type="text" name="username" class="form-control">
                    <small th:if="${usernameError}" class="text-danger" th:text="${usernameError}"></small>
                </div>

                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" name="password" class="form-control">
                    <small th:if="${passwordError}" class="text-danger" th:text="${passwordError}"></small>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Đăng Nhập</button>
            </form>

            <div class="text-center mt-3">
                <small>Chưa có tài khoản? <a th:href="@{/register}">Đăng ký ngay</a></small>
            </div>
        </div>
    </div>
</div>
</body>
</html>
