<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>
<body>
    <div class="card mx-auto" style="max-width: 600px;">
        <div class="card-header bg-info text-white">
            <h4 th:text="${equipment.id == null ? 'Thêm mới thiết bị' : 'Cập nhật thiết bị'}"></h4>
        </div>
        <div class="card-body">
            <form th:action="@{/admin/equipments/save}" th:object="${equipment}" method="post">
                <input type="hidden" th:field="*{id}" />
                <div class="form-group">
                    <label>Tên thiết bị</label>
                    <input type="text" th:field="*{name}" class="form-control" required />
                </div>
                <div class="form-group">
                    <label>Mô tả</label>
                    <textarea th:field="*{description}" class="form-control"></textarea>
                </div>
                <div class="form-group">
                    <label>Số lượng tồn kho</label>
                    <input type="number" th:field="*{quantity}" class="form-control" min="0" required />
                </div>
                <div class="text-right">
                    <a href="/admin/equipments" class="btn btn-light">Hủy</a>
                    <button type="submit" class="btn btn-success">Lưu thiết bị</button>
                </div>
            </form>
        </div>
    </div>
<!-- Optional JavaScript -->
<!-- jQuery first, then Popper.js, then Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
</body>
</html>
