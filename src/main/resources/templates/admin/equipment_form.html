<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thiết bị</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-4">
    <div class="card mx-auto shadow-sm" style="max-width: 600px;">
        <div class="card-header bg-info text-white">
            <h4 class="mb-0" th:text="${equipment.id == null ? 'Thêm mới thiết bị' : 'Cập nhật thiết bị'}"></h4>
        </div>

        <div class="card-body">
            <form th:action="@{/admin/equipments/save}" method="post" novalidate>
                <input type="hidden" name="id" th:value="${equipment.id}">

                <div class="form-group">
                    <label>Tên thiết bị</label>
                    <input type="text" name="name" class="form-control" th:value="${equipment.name}">
                    <small th:if="${nameError}" class="text-danger" th:text="${nameError}"></small>
                </div>

                <div class="form-group">
                    <label>Mô tả</label>
                    <textarea name="description" class="form-control" rows="3" th:text="${equipment.description}"></textarea>
                    <small th:if="${descriptionError}" class="text-danger" th:text="${descriptionError}"></small>
                </div>

                <div class="form-group">
                    <label>Số lượng tồn kho</label>
                    <input type="number" name="quantityInput" class="form-control"
                           th:value="${quantityInput != null ? quantityInput : equipment.quantity}">
                    <small th:if="${quantityError}" class="text-danger" th:text="${quantityError}"></small>
                </div>

                <div class="text-right">
                    <a th:href="@{/admin/equipments}" class="btn btn-light">Hủy</a>
                    <button type="submit" class="btn btn-success">Lưu thiết bị</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
