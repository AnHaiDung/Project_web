<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark p-3">
    <a class="navbar-brand" href="#">Smart Academic Admin</a>
    <span class="navbar-text text-white">
        Chào, <b th:text="${session.userSession.profile != null ? session.userSession.profile.fullName : 'Admin'}"></b>
    </span>
</nav>

<div class="container mt-5">
    <div class="row text-center">
        <div class="col-md-4 mb-3">
            <div class="card p-3">
                <h5>Quản lý thiết bị</h5>
                <a th:href="@{/admin/equipments}" class="btn btn-primary">Xem danh sách</a>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card p-3">
                <h5>Phiếu chờ cấp phát</h5>
                <a th:href="@{/admin/borrowings}" class="btn btn-success">Xem phiếu mượn</a>
            </div>
        </div>
    </div>

    <hr>
    <a th:href="@{/logout}" class="btn btn-danger">Đăng xuất</a>
</div>
</body>
</html>
