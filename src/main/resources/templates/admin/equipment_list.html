<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>
<body>
    <div class="d-flex justify-content-between mb-3">
        <h2>Danh sách Thiết bị / Tài liệu</h2>
        <a th:href="@{/admin/equipments/add}" class="btn btn-primary">Thêm thiết bị mới</a>
    </div>
    <table class="table table-bordered table-hover">
        <thead class="thead-dark">
        <tr>
            <th>ID</th>
            <th>Tên thiết bị</th>
            <th>Mô tả</th>
            <th>Tồn kho</th>
            <th>Hành động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="e : ${equipments}">
            <td th:text="${e.id}"></td>
            <td th:text="${e.name}"></td>
            <td th:text="${e.description}"></td>
            <td th:text="${e.quantity}"></td>
            <td>
                <a th:href="@{/admin/equipments/edit/{id}(id=${e.id})}" class="btn btn-sm btn-warning">Sửa</a>
                <a th:href="@{/admin/equipments/delete/{id}(id=${e.id})}"
                   class="btn btn-sm btn-danger"
                   onclick="return confirm('Xóa thiết bị này?')">Xóa</a>
            </td>
        </tr>
        </tbody>
    </table>
    <a href="/admin/home" class="btn btn-secondary">Quay lại Dashboard</a>
<!-- Optional JavaScript -->
<!-- jQuery first, then Popper.js, then Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
</body>
</html>
