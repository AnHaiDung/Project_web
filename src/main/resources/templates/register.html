<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Đăng ký</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5" style="max-width: 500px;">
    <div class="card shadow-sm">
        <div class="card-body">
            <h4 class="text-center text-success mb-4">Đăng Ký Tài Khoản</h4>

            <form th:action="@{/register}" method="post">
                <div class="form-group">
                    <label>Họ và Tên</label>
                    <input type="text" name="profile.fullName" class="form-control">
                    <small th:if="${fullNameError}" class="text-danger" th:text="${fullNameError}"></small>
                </div>

                <div class="form-group">
                    <label>Tên đăng nhập</label>
                    <input type="text" name="username" class="form-control">
                    <small th:if="${usernameError}" class="text-danger" th:text="${usernameError}"></small>
                </div>

                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" name="password" class="form-control">
                    <small th:if="${passwordError}" class="text-danger" th:text="${passwordError}"></small>
                </div>

                <button type="submit" class="btn btn-success btn-block">Đăng Ký</button>
            </form>

            <hr>
            <div class="text-center">
                <a th:href="@{/login}" class="text-muted small">Đã có tài khoản? Đăng nhập</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
