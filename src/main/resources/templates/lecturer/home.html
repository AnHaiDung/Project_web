<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Giảng viên - Trang chủ</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        .table-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .badge-available {
            background-color: #17a2b8;
            color: white;
        }
    </style>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="#">Smart Academic</a>
    <div class="navbar-text ml-auto">
        Xin chào,
        <b th:text="${session.userSession.profile != null ? session.userSession.profile.fullName : session.userSession.username}"></b>
        |
        <a th:href="@{/logout}" class="text-danger ml-2">Đăng xuất</a>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Quản lý lịch tư vấn</h2>
        <a th:href="@{/mentoring/lecturer/add}" class="btn btn-success font-weight-bold">
            + Tạo khung giờ trống
        </a>
    </div>

    <div class="table-container">
        <table class="table table-hover">
            <thead class="thead-dark">
            <tr>
                <th>Thời gian</th>
                <th>Chủ đề</th>
                <th>Sinh viên đăng ký</th>
                <th>Phòng Lab</th>
                <th>Trạng thái</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="s : ${mySchedules}">
                <td th:text="${s.startTime != null ? #dates.format(s.startTime, 'dd/MM/yyyy HH:mm') : 'Chưa có thời gian'}"></td>

                <td th:text="${s.topic != null ? s.topic : 'Chưa có chủ đề'}"></td>

                <td>
                    <span th:if="${s.student != null && s.student.profile != null}"
                          th:text="${s.student.profile.fullName}"></span>

                    <span th:if="${s.student != null && s.student.profile == null}"
                          th:text="${s.student.username}"></span>

                    <span th:if="${s.student == null}" class="text-muted small italic">
                        Đang chờ đăng ký...
                    </span>
                </td>

                <td>
                    <span class="badge badge-secondary"
                          th:text="${s.labRoom != null ? s.labRoom.roomName : 'Chưa có phòng'}"></span>
                </td>

                <td>
                    <span th:if="${s.status == 'AVAILABLE'}" class="badge badge-available">Sẵn sàng</span>
                    <span th:if="${s.status == 'PENDING'}" class="badge badge-warning">Chờ duyệt</span>
                    <span th:if="${s.status == 'APPROVED'}" class="badge badge-success">Đã xác nhận</span>
                    <span th:if="${s.status == 'REJECTED'}" class="badge badge-danger">Đã từ chối</span>
                    <span th:if="${s.status == null}" class="badge badge-secondary">Chưa có trạng thái</span>
                </td>
            </tr>

            <tr th:if="${mySchedules == null || #lists.isEmpty(mySchedules)}">
                <td colspan="5" class="text-center text-muted">
                    Bạn chưa tạo lịch trống nào. Hãy nhấn nút "Tạo khung giờ trống" để bắt đầu.
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
