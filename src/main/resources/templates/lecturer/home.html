<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <title>Giảng viên - Quản lý lịch</title>
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <a class="navbar-brand">Hệ thống Smart Academic</a>
    <div class="ml-auto text-white">
        Chào GV: <b th:text="${session.userSession.profile.fullName}"></b> |
        <a th:href="@{/logout}" class="text-danger">Đăng xuất</a>
    </div>
</nav>
<div class="container mt-4">
    <h3>Danh sách yêu cầu hướng dẫn (Mentoring)</h3>
    <table class="table table-striped mt-3">
        <thead class="thead-dark">
        <tr>
            <th>Sinh viên</th>
            <th>Chủ đề</th>
            <th>Ngày yêu cầu</th>
            <th>Phòng Lab</th>
            <th>Trạng thái</th>
            <th>Thao tác</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${sessions}">
            <td th:text="${s.student.profile.fullName}"></td>
            <td th:text="${s.topic}"></td>
            <td th:text="${#dates.format(s.startTime, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${s.labRoom.roomName}"></td>
            <td>
                <span th:text="${s.status}" th:classappend="${s.status == 'PENDING' ? 'badge badge-warning' : (s.status == 'APPROVED' ? 'badge badge-success' : 'badge badge-danger')}"></span>
            </td>
            <td>
                <div th:if="${s.status == 'PENDING'}">
                    <a th:href="@{'/lecturer/approve/' + ${s.id}}" class="btn btn-sm btn-success">Duyệt</a>
                    <a th:href="@{'/lecturer/reject/' + ${s.id}}" class="btn btn-sm btn-danger">Từ chối</a>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
