<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Giảng viên - Trang chủ</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="#">Smart Academic - Giảng viên</a>
    <div class="navbar-text ml-auto">
        Xin chào,
        <b th:text="${session.userSession.profile != null ? session.userSession.profile.fullName : session.userSession.username}"></b>
        |
        <a th:href="@{/logout}" class="text-danger ml-2">Đăng xuất</a>
    </div>
</nav>

<div class="container mt-4">
    <div th:if="${msgSuccess}" class="alert alert-success" th:text="${msgSuccess}"></div>
    <div th:if="${msgError}" class="alert alert-danger" th:text="${msgError}"></div>

    <h3>Danh sách sinh viên chờ tư vấn</h3>

    <div th:if="${pendingSessions == null || #lists.isEmpty(pendingSessions)}" class="alert alert-info">
        Hiện chưa có sinh viên nào chờ tư vấn.
    </div>

    <div th:each="s : ${pendingSessions}" class="card mb-3">
        <div class="card-header">
            <b th:text="${s.student != null && s.student.profile != null ? s.student.profile.fullName : 'Sinh viên'}"></b>
            -
            <span th:text="${s.startTime != null ? #dates.format(s.startTime, 'dd/MM/yyyy HH:mm') : 'Chưa có thời gian'}"></span>
        </div>
        <div class="card-body">
            <p>
                <b>Chủ đề:</b>
                <span th:text="${s.topic != null ? s.topic : 'Chưa có chủ đề'}"></span>
            </p>

            <form th:action="@{/lecturer/complete}" method="post">
                <input type="hidden" name="sessionId" th:value="${s.id}">

                <div class="form-group">
                    <label>Đánh giá năng lực</label>
                    <select name="competencyLevel" class="form-control" required>
                        <option value="">-- Chọn mức đánh giá --</option>
                        <option value="Tốt">Tốt</option>
                        <option value="Khá">Khá</option>
                        <option value="Trung bình">Trung bình</option>
                        <option value="Cần cải thiện">Cần cải thiện</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Nhận xét</label>
                    <textarea name="comment" class="form-control" rows="3" required></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group col-md-8">
                        <label>Thiết bị/Tài liệu cần cấp</label>
                        <select name="equipmentId" class="form-control">
                            <option value="">-- Không cấp thiết bị --</option>
                            <option th:each="e : ${equipments}"
                                    th:value="${e.id}"
                                    th:text="${e.name + ' - tồn kho: ' + e.quantity}">
                            </option>
                        </select>
                    </div>

                    <div class="form-group col-md-4">
                        <label>Số lượng</label>
                        <input type="number" name="quantity" class="form-control" min="1" value="1">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">Lưu đánh giá & tạo phiếu cấp phát</button>
                <a th:href="@{/lecturer/reject/{id}(id=${s.id})}" class="btn btn-danger"
                   onclick="return confirm('Từ chối lịch tư vấn này?')">Từ chối</a>
            </form>
        </div>
    </div>

    <hr>

    <h4>Tất cả lịch tư vấn của tôi</h4>
    <table class="table table-bordered table-hover bg-white">
        <thead class="thead-dark">
        <tr>
            <th>Thời gian</th>
            <th>Sinh viên</th>
            <th>Chủ đề</th>
            <th>Trạng thái</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${allSessions}">
            <td th:text="${s.startTime != null ? #dates.format(s.startTime, 'dd/MM/yyyy HH:mm') : 'Chưa có thời gian'}"></td>
            <td th:text="${s.student != null && s.student.profile != null ? s.student.profile.fullName : 'Không rõ'}"></td>
            <td th:text="${s.topic != null ? s.topic : 'Chưa có chủ đề'}"></td>
            <td>
                <span th:if="${s.status == 'PENDING'}" class="badge badge-warning">Chờ xác nhận</span>
                <span th:if="${s.status == 'WAITING_ALLOCATION'}" class="badge badge-info">Chờ cấp phát</span>
                <span th:if="${s.status == 'EXPORTED'}" class="badge badge-success">Đã xuất kho</span>
                <span th:if="${s.status == 'REJECTED'}" class="badge badge-danger">Bị từ chối</span>
            </td>
        </tr>
        <tr th:if="${allSessions == null || #lists.isEmpty(allSessions)}">
            <td colspan="4" class="text-center text-muted">Chưa có lịch tư vấn nào.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
