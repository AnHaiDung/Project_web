<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Giảng viên - Quản lý lịch</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="#">Smart Academic</a>
    <div class="navbar-text ml-auto">
        Xin chào, <b th:text="${session.userSession.profile.fullName}"></b> |
        <a href="/logout" class="text-danger">Đăng xuất</a>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between mb-4">
        <h2>Lịch tư vấn tôi đã tạo</h2>
        <a href="/lecturer/mentoring/add" class="btn btn-success"> + Tạo lịch trống mới</a>
    </div>

    <table class="table table-bordered shadow-sm">
        <thead class="thead-light">
        <tr>
            <th>Thời gian</th>
            <th>Chủ đề</th>
            <th>Sinh viên đăng ký</th>
            <th>Thiết bị</th>
            <th>Trạng thái</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${mySchedules}">
            <td th:text="${#dates.format(s.startTime, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${s.topic}"></td>
            <td>
                <span th:if="${s.student != null}" th:text="${s.student.profile.fullName}"></span>
                <span th:if="${s.student == null}" class="text-muted italic text-small">Chưa có ai đăng ký</span>
            </td>
            <td th:text="${s.equipment != null ? s.equipment.name : 'Không'}"></td>
            <td>
                <span th:if="${s.status == 'AVAILABLE'}" class="badge badge-info">Đang chờ SV</span>
                <span th:if="${s.status == 'PENDING'}" class="badge badge-warning">Đang chờ duyệt</span>
                <span th:if="${s.status == 'APPROVED'}" class="badge badge-success">Đã xác nhận</span>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(mySchedules)}">
            <td colspan="5" class="text-center">Bạn chưa tạo khung giờ tư vấn nào.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
