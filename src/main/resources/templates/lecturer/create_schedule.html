<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tạo lịch tư vấn</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4" style="max-width: 700px;">
    <h3>Tạo khung giờ tư vấn</h3>

    <form th:action="@{/mentoring/lecturer/save}" method="post" th:object="${sessionData}">
        <div class="form-group">
            <label>Chủ đề tư vấn</label>
            <input type="text" th:field="*{topic}" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Thời gian</label>
            <input type="datetime-local" th:field="*{startTime}" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Phòng Lab</label>
            <select name="labRoomId" class="form-control" required>
                <option value="">-- Chọn phòng lab --</option>
                <option th:each="room : ${labRooms}"
                        th:value="${room.id}"
                        th:text="${room.roomName}">
                </option>
            </select>
        </div>

        <div class="form-group">
            <label>Thiết bị hỗ trợ</label>
            <select name="equipmentId" class="form-control">
                <option value="">-- Không cần thiết bị --</option>
                <option th:each="e : ${equipments}"
                        th:value="${e.id}"
                        th:text="${e.name + ' (SL: ' + e.quantity + ')'}">
                </option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Tạo lịch trống</button>
        <a th:href="@{/lecturer/home}" class="btn btn-secondary">Quay lại</a>
    </form>
</div>
</body>
</html>
