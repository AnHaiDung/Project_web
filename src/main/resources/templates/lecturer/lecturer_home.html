<!doctype html>
<html lang="en">
<head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <a class="navbar-brand">Smart Academic - Giảng viên</a>
        <div class="navbar-text ml-auto text-white">
            Chào GV: <b th:text="${session.userSession.profile.fullName}"></b> |
            <a th:href="@{/logout}" class="text-danger">Đăng xuất</a>
        </div>
    </nav>
    <div class="container mt-4">
        <h3>Danh sách phiếu yêu cầu cố vấn</h3>
        <table class="table table-bordered mt-3">
            <thead class="thead-light">
            <tr>
                <th>Sinh viên</th>
                <th>Chủ đề</th>
                <th>Thời gian tạo</th>
                <th>Phòng Lab</th>
                <th>Trạng thái</th>
                <th>Hành động</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s : ${sessions}">
                <td th:text="${s.student.profile.fullName}"></td>
                <td th:text="${s.topic}"></td>
                <td th:text="${#dates.format(s.startTime, 'dd/MM/yyyyHH:mm')}"></td>
                <td th:text="${s.labRoom.roomName}"></td>
                <td>
    <span th:text="${s.status}" th:classappend="${s.status == 'PENDING' ? 'badge badge-warning' : (s.status == 'APPROVED' ?'badge badge-success' : 'badge badge-danger')}"></span>
                </td>
                <td>
                    <div th:if="${s.status == 'PENDING'}">
                        <a th:href="@{'/lecturer/approve/' + ${s.id}}"

                           class="btn btn-sm btn-success">Duyệt</a>
                        <a th:href="@{'/lecturer/reject/' + ${s.id}}"
                           class="btn btn-sm btn-danger">Từ chối</a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
<!-- Optional JavaScript -->
<!-- jQuery first, then Popper.js, then Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
</body>
</html>
